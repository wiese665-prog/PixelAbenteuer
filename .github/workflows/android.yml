name: Android APK
on:
  push:
    branches: [main, 'experiment/2-5d-kamera']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command line tools
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK
        run: |
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Convert animal sprite animations
        run: |
          python3 -m pip install Pillow
          python3 scripts/convert_sprites.py
      - name: Verify village assets and room routes
        run: |
          python3 scripts/verify_guild_layout.py
          python3 scripts/verify_village_refinement.py
          python3 scripts/verify_character_views.py
          python3 scripts/verify_class_sprites.py
      - name: Simulate unique village residents
        run: |
          python3 scripts/export_resident_world.py /tmp/pixel-resident-world.bin
          mkdir -p /tmp/pixel-resident-tests
          javac -encoding UTF-8 -d /tmp/pixel-resident-tests app/src/main/java/de/pixelabenteuer/game/VillageResidents.java tests/VillageResidentsTest.java
          java -cp /tmp/pixel-resident-tests de.pixelabenteuer.game.VillageResidentsTest /tmp/pixel-resident-world.bin
      - name: Verify bounded mob navigation
        run: |
          mkdir -p /tmp/pixel-navigation-tests
          javac -encoding UTF-8 -d /tmp/pixel-navigation-tests app/src/main/java/de/pixelabenteuer/game/MobNavigation.java tests/MobNavigationTest.java
          java -cp /tmp/pixel-navigation-tests de.pixelabenteuer.game.MobNavigationTest
      - name: Verify intermittent ambient animation
        run: |
          mkdir -p /tmp/pixel-ambient-tests
          javac -encoding UTF-8 -d /tmp/pixel-ambient-tests app/src/main/java/de/pixelabenteuer/game/AmbientMotion.java tests/AmbientMotionTest.java
          java -cp /tmp/pixel-ambient-tests de.pixelabenteuer.game.AmbientMotionTest
      - name: Verify archer and mage combat
        run: |
          mkdir -p /tmp/pixel-ranged-tests
          javac -encoding UTF-8 -d /tmp/pixel-ranged-tests app/src/main/java/de/pixelabenteuer/game/RangedCombat.java tests/RangedCombatTest.java
          java -cp /tmp/pixel-ranged-tests de.pixelabenteuer.game.RangedCombatTest
      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelAbenteuer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
